const firebaseApp=getApps().length?getApp():initializeApp(FIREBASE_CONFIG);

const callableDeleteEmployee=httpsCallable(functions,'adminDeleteEmployee');

let db={settings:{...DEFAULT_SETTINGS},users:[],directory:[],attendance:[],lessons:[],substitutions:[]};
function authEmailFromUsername(username){
  const normalized=String(username||'').trim().toLowerCase();
  return normalized+AUTH_DOMAIN_SUFFIX;
}
async function createEmployeeHttp(payload){
  try{
    const result=await callableCreateEmployee(payload);
    return result?.data||result||{};
  }catch(err){
    throw new Error(err?.message||'Gagal membuat akun karyawan di Firebase.');
  }
}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initials(n=''){return n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'U'}
function nowIso(){return new Date().toISOString()}
function dateKey(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDate(iso){return new Intl.DateTimeFormat('id-ID',{dateStyle:'medium'}).format(new Date(iso+'T00:00:00'))}
function fmtTime(iso){return new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(iso))}
function fmtTimeShort(iso){return new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}
function dayName(d=new Date()){return DAYS.find(x=>x[0]===String(d.getDay()))?.[1]||''}
function minutesFromTime(s){if(!s)return 0;const [h,m]=s.split(':').map(Number);return h*60+m}
function toast(msg,type=''){const el=document.getElementById('toast')||createToast();el.textContent=msg;el.className='toast show '+type;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.className='toast',3200)}
function createToast(){const el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);return el}
function systemConfirm(title,message,okText='Ya',cancelText='Batal',type='warning'){return new Promise(resolve=>{openModal(`<div class="modal-head"><div><strong>${esc(title)}</strong><div style="color:#64748b;font-size:12px">Konfirmasi tindakan</div></div><button class="close" id="sysClose">×</button></div><div class="modal-body"><div style="display:flex;gap:14px;align-items:flex-start"><div class="system-icon">${type==='danger'?'!':'?'}</div><div style="line-height:1.6;color:#475569;font-size:13px">${message}</div></div></div><div class="modal-foot"><button type="button" class="btn btn-white" id="sysCancel">${esc(cancelText)}</button><button type="button" class="btn ${type==='danger'?'btn-danger':'btn-primary'}" id="sysOk">${esc(okText)}</button></div>`);const finish=v=>{closeModal();resolve(v)};document.getElementById('sysCancel').onclick=()=>finish(false);document.getElementById('sysClose').onclick=()=>finish(false);document.getElementById('sysOk').onclick=()=>finish(true)})}
function openModal(html){let b=document.getElementById('modalBackdrop');if(!b){b=document.createElement('div');b.id='modalBackdrop';b.className='modal-backdrop';b.innerHTML='<div class="modal" id="modalBox"></div>';document.body.appendChild(b);b.addEventListener('click',e=>{if(e.target===b)closeModal()})}document.getElementById('modalBox').innerHTML=html;b.classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop')?.classList.remove('show')}
function me(){return db.users.find(u=>u.id===session?.id)||initialProfile}
function dirUser(uid){return db.directory.find(u=>u.id===uid)||db.users.find(u=>u.id===uid)}
function friendlyAuthError(err){
  const c=err?.code||'';
  return ({
    'auth/invalid-credential':'Username atau password tidak sesuai.',
    'auth/invalid-login-credentials':'Username atau password tidak sesuai.',
    'auth/user-disabled':'Akun ini dinonaktifkan oleh Administrator.',
    'auth/too-many-requests':'Terlalu banyak percobaan login. Coba lagi beberapa saat.',
    'auth/network-request-failed':'Koneksi internet bermasalah.',
    'auth/operation-not-allowed':'Metode Email/Password belum diaktifkan di Firebase Authentication.'
  })[c]||err?.message||'Terjadi kesalahan.';
}

async function applyPersistence(remember){await setPersistence(auth,remember?browserLocalPersistence:browserSessionPersistence)}
function clearListeners(){unsubscribers.forEach(u=>{try{u()}catch{}});unsubscribers=[]}
function scheduleRender(){if(!session||!profileReady)return;clearTimeout(window.renderDebounce);window.renderDebounce=setTimeout(()=>render(),60)}

async function ensureProfile(user){
  const ref=doc(dbFs,'users',user.uid);
  const snap=await getDoc(ref);
  if(snap.exists())return {...snap.data(),id:snap.id};
  if((user.email||'').toLowerCase()===authEmailFromUsername('admin')){
    const profile={id:user.uid,role:'admin',username:'admin',authEmail:user.email,name:'Administrator Utama',nik:'ADM-001',department:'Administrator',position:'System Administrator',phone:'-',email:'',active:true,createdAt:dateKey()};
    await setDoc(ref,profile,{merge:true});
    await setDoc(doc(dbFs,'directory',user.uid),{id:user.uid,name:profile.name,nik:profile.nik,department:profile.department,position:profile.position,active:true,role:'admin'},{merge:true});
    return profile;
  }
  throw new Error('Profil akun belum dibuat. Hubungi Administrator.');
}

function attachDataListeners(profile){
  clearListeners();
  unsubscribers.push(onSnapshot(doc(dbFs,'settings','main'),snap=>{db.settings=snap.exists()?{...DEFAULT_SETTINGS,...snap.data()}: {...DEFAULT_SETTINGS};scheduleRender();},err=>toast('Gagal membaca pengaturan Firebase: '+err.message,'err')));
  unsubscribers.push(onSnapshot(collection(dbFs,'directory'),snap=>{db.directory=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRender();},err=>toast('Gagal membaca direktori Firebase: '+err.message,'err')));
  unsubscribers.push(onSnapshot(collection(dbFs,'lessons'),snap=>{db.lessons=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRender();},err=>toast('Gagal membaca jadwal Firebase: '+err.message,'err')));
  unsubscribers.push(onSnapshot(collection(dbFs,'substitutions'),snap=>{db.substitutions=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRender();},err=>toast('Gagal membaca pengajuan pengganti Firebase: '+err.message,'err')));
  if(profile.role==='admin'){
    unsubscribers.push(onSnapshot(collection(dbFs,'users'),snap=>{db.users=snap.docs.map(d=>({id:d.id,...d.data()}));if(session){initialProfile=db.users.find(x=>x.id===session.id)||initialProfile}profileReady=true;scheduleRender();},err=>toast('Gagal membaca data karyawan: '+err.message,'err')));
    unsubscribers.push(onSnapshot(collection(dbFs,'attendance'),snap=>{db.attendance=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRender();},err=>toast('Gagal membaca data absensi: '+err.message,'err')));
  }else{
    unsubscribers.push(onSnapshot(doc(dbFs,'users',profile.id),snap=>{if(!snap.exists()){signOut(auth);return}const p={id:snap.id,...snap.data()};initialProfile=p;db.users=[p];profileReady=true;if(p.active===false){toast('Akun Anda dinonaktifkan oleh Administrator.','err');signOut(auth);return}scheduleRender();},err=>toast('Gagal membaca profil: '+err.message,'err')));
    const aq=query(collection(dbFs,'attendance'),where('userId','==',profile.id));
    unsubscribers.push(onSnapshot(aq,snap=>{db.attendance=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRender();},err=>toast('Gagal membaca riwayat absensi: '+err.message,'err')));
  }
}

async function startAppForUser(user){
  try{
    const profile=await ensureProfile(user);
    if(profile.role==='admin'){const st=await getDoc(doc(dbFs,'settings','main'));if(!st.exists())await setDoc(doc(dbFs,'settings','main'),{...DEFAULT_SETTINGS,createdAt:nowIso(),updatedBy:user.uid},{merge:true});}
    if(!profile.active){await signOut(auth);toast('Akun Anda sedang nonaktif.','err');return}
    session={id:user.uid,role:profile.role};initialProfile=profile;db.users=profile.role==='admin'?[]:[profile];profileReady=true;currentPage='dashboard';pageState={};attachDataListeners(profile);
    appReady=true;render();
  }catch(e){console.error(e);await signOut(auth);toast(e.message||'Profil pengguna tidak dapat dimuat.','err')}
}

async function login(e){
  e.preventDefault();
  const us=document.getElementById('loginUser').value.trim(),pw=document.getElementById('loginPass').value,remember=document.getElementById('rememberMe').checked;
  if(!us||!pw)return;
  try{await applyPersistence(remember);await signInWithEmailAndPassword(auth,authEmailFromUsername(us),pw)}catch(err){toast(friendlyAuthError(err),'err')}
}
async function logout(){clearListeners();session=null;profileReady=false;appReady=false;initialProfile=null;db={settings:{...DEFAULT_SETTINGS},users:[],directory:[],attendance:[],lessons:[],substitutions:[]};await signOut(auth).catch(()=>{});render()}

function restoreAuthObserver(){
  onAuthStateChanged(auth,async user=>{if(user){await startAppForUser(user)}else{clearListeners();session=null;profileReady=false;appReady=false;initialProfile=null;render()}});
}

function pager(total,page,per=10,key='default'){const pages=Math.max(1,Math.ceil(total/per));page=Math.min(Math.max(1,page),pages);let btns='';for(let i=1;i<=pages;i++)btns+=`<button class="page-btn ${i===page?'active':''}" data-pager="${key}" data-page-no="${i}">${i}</button>`;return `<div class="pagination"><div class="pagination-info">Menampilkan ${total?((page-1)*per+1):0}–${Math.min(page*per,total)} dari ${total} data</div><div class="page-buttons"><button class="page-btn" data-pager="${key}" data-page-no="${page-1}" ${page<=1?'disabled':''}>‹</button>${btns}<button class="page-btn" data-pager="${key}" data-page-no="${page+1}" ${page>=pages?'disabled':''}>›</button></div></div>`}
function slicePage(arr,key,per=10){const page=pageState[key]||1;const pages=Math.max(1,Math.ceil(arr.length/per));const safe=Math.min(page,pages);pageState[key]=safe;return {rows:arr.slice((safe-1)*per,safe*per),page:safe,pages}}

async function saveEmployee(e,id){e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());const existing=id?db.users.find(x=>x.id===id):null;if(db.users.some(u=>u.username===o.username&&u.id!==id))return toast('Username sudah digunakan.','err');if(db.users.some(u=>u.nik===o.nik&&u.id!==id))return toast('NIK sudah digunakan.','err');
  try{
    if(!id){
      if((o.password||'').length<6)return toast('Password minimal 6 karakter.','err');
      const res=await createEmployeeHttp({username:o.username,name:o.name,password:o.password,nik:o.nik,department:o.department||'',position:o.position||'',phone:o.phone||'',email:o.email||''});
      toast('Karyawan berhasil ditambahkan dan akun Firebase dibuat.','ok');
    }else{
      const data={nik:o.nik,name:o.name,department:o.department||'',position:o.position||'',phone:o.phone||'',email:o.email||'',username:existing.username,role:'employee',active:existing.active,authEmail:existing.authEmail,updatedAt:nowIso()};
      await setDoc(doc(dbFs,'users',id),data,{merge:true});
      await setDoc(doc(dbFs,'directory',id),{id,name:o.name,nik:o.nik,department:o.department||'',position:o.position||'',active:existing.active,role:'employee'},{merge:true});
      if(o.password){if(o.password.length<6)return toast('Password minimal 6 karakter.','err');await callableSetEmployeePassword({uid:id,newPassword:o.password})}
      toast('Data karyawan diperbarui.','ok');
    }
    closeModal();
  }catch(err){toast(err?.message||'Gagal menyimpan karyawan.','err')}
}

function adminLessons(){const items=db.lessons.slice().sort((a,b)=>a.name.localeCompare(b.name,'id'));return `${pageHead('ADMINISTRATOR','Jadwal Mengajar','Buat les/mapel dan atur jadwal guru dalam seminggu.','<button class="btn btn-primary" id="addLesson">+ Tambah Les / Mapel</button>')}<div class="card"><div class="card-head"><div><h3 class="section-title">Daftar les / mapel</h3><p class="section-sub">Total ${items.length} jadwal mapel.</p></div><input class="input search" id="lessonSearch" value="${esc(pageState.lessonSearch||'')}" placeholder="Cari mapel, guru, kelas..."></div><div id="lessonTable"></div></div>`}

function lessonForm(l=null){const teachers=activeEmployees(),selectedDays=l?.days||[];openModal(`<div class="modal-head"><div><strong>${l?'Edit Les / Mapel':'Tambah Les / Mapel'}</strong><div style="color:#64748b;font-size:12px">Atur guru, hari dan jam mengajar.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="lessonForm"><div class="modal-body"><div class="form-grid"><div class="field"><label>Nama les / mapel *</label><input class="input" name="name" value="${esc(l?.name||'')}" required></div><div class="field"><label>Kode mapel</label><input class="input" name="subjectCode" value="${esc(l?.subjectCode||'')}"></div><div class="field"><label>Guru *</label><select class="select" name="teacherId" required><option value="">Pilih guru</option>${teachers.map(u=>`<option value="${u.id}" ${l?.teacherId===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Kelas / kelompok</label><input class="input" name="className" value="${esc(l?.className||'')}"></div><div class="field"><label>Jam mulai *</label><input class="input" type="time" name="start" value="${esc(l?.start||'07:00')}" required></div><div class="field"><label>Jam selesai *</label><input class="input" type="time" name="end" value="${esc(l?.end||'08:00')}" required></div><div class="field full"><label>Hari mengajar dalam seminggu *</label><div class="checkbox-grid">${DAYS.map(d=>`<label class="day-option"><input type="checkbox" name="days" value="${d[0]}" ${selectedDays.includes(d[0])?'checked':''}> ${d[1]}</label>`).join('')}</div></div><div class="field full"><label>Catatan</label><textarea class="textarea" name="notes" rows="3">${esc(l?.notes||'')}</textarea></div></div></div><div class="modal-foot"><button type="button" class="btn btn-white" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan</button></div></form>`);document.getElementById('lessonForm').onsubmit=e=>saveLesson(e,l?.id)}
async function saveLesson(e,id){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.days=[...e.target.querySelectorAll('input[name="days"]:checked')].map(x=>x.value);if(!o.days.length)return toast('Pilih minimal satu hari.','err');if(minutesFromTime(o.end)<=minutesFromTime(o.start))return toast('Jam selesai harus lebih besar dari jam mulai.','err');try{const refId=id||('l_'+Date.now()+'_'+Math.random().toString(36).slice(2,8));const payload={id:refId,...o,active:id?!!db.lessons.find(x=>x.id===id)?.active:true,createdAt:id?(db.lessons.find(x=>x.id===id)?.createdAt||dateKey()):dateKey(),updatedAt:nowIso()};await setDoc(doc(dbFs,'lessons',refId),payload,{merge:true});closeModal();toast(id?'Jadwal diperbarui.':'Les/mapel berhasil ditambahkan.','ok')}catch(err){toast(err.message||'Gagal menyimpan jadwal.','err')}}

function adminSubstitutions(){return `${pageHead('ADMINISTRATOR','Persetujuan Pengganti','Setujui atau tolak guru yang ingin menggantikan jadwal guru lain.')}<div class="card"><div class="card-head"><div><h3 class="section-title">Daftar pengajuan</h3><p class="section-sub">Pengajuan yang masih menunggu harus disetujui sebelum guru pengganti dapat absen.</p></div><select class="select" id="subStatusFilter"><option value="">Semua status</option><option value="pending">Menunggu</option><option value="approved">Disetujui</option><option value="rejected">Ditolak</option></select></div><div id="subTable"></div></div>`}
function renderSubTable(){const q=document.getElementById('subStatusFilter')?.value||pageState.subStatus||'';let rows=db.substitutions.filter(s=>!q||s.status===q).sort((a,b)=>new Date(b.requestedAt||0)-new Date(a.requestedAt||0));const {rows:items,page}=slicePage(rows,'substitutions');document.getElementById('subTable').innerHTML=items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Les / Mapel</th><th>Guru asli</th><th>Guru pengganti</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${items.map(s=>{const lesson=db.lessons.find(l=>l.id===s.lessonId);return `<tr><td>${fmtDate(s.date)}</td><td><strong>${esc(lesson?.name||'—')}</strong><br><small>${esc(lesson?.start||'')}–${esc(lesson?.end||'')}</small></td><td>${esc(getTeacherName(s.originalTeacherId))}</td><td>${esc(getTeacherName(s.substituteTeacherId))}</td><td>${s.status==='pending'?'<span class="badge badge-yellow">Menunggu</span>':s.status==='approved'?'<span class="badge badge-green">Disetujui</span>':'<span class="badge badge-red">Ditolak</span>'}</td><td>${s.status==='pending'?`<div class="toolbar"><button class="btn btn-success btn-sm" data-approve-sub="${s.id}">Approve</button><button class="btn btn-danger btn-sm" data-reject-sub="${s.id}">Tolak</button></div>`:'—'}</td></tr>`}).join('')}</tbody></table></div>${pager(rows.length,page,10,'substitutions')}`:`<div class="empty">Tidak ada pengajuan.</div>`}
async function approveSub(id,approve){const s=db.substitutions.find(x=>x.id===id);if(!s)return;try{await updateDoc(doc(dbFs,'substitutions',id),{status:approve?'approved':'rejected',approvedAt:nowIso(),approvedBy:session.id});toast(approve?'Pengajuan disetujui.':'Pengajuan ditolak.',approve?'ok':'err')}catch(err){toast(err.message||'Gagal memproses pengajuan.','err')}}

function adminAttendance(){return `${pageHead('ADMINISTRATOR','Data Absensi','Pantau dan edit seluruh riwayat absensi guru.')}<div class="card"><div class="card-head"><div><h3 class="section-title">Riwayat absensi</h3><p class="section-sub">Maksimal 10 data ditampilkan per halaman.</p></div><div class="toolbar"><input class="input" type="date" id="attDate" value="${esc(pageState.attDate||dateKey())}"><input class="input search" id="attSearch" value="${esc(pageState.attSearch||'')}" placeholder="Cari guru..."><button class="btn btn-white" id="exportCsv">Export CSV</button></div></div><div id="attTable"></div></div>`}
function renderAttTable(){const d=document.getElementById('attDate')?.value||dateKey(),q=(document.getElementById('attSearch')?.value||'').toLowerCase();pageState.attDate=d;pageState.attSearch=q;let rows=db.attendance.filter(a=>a.date===d);rows=rows.filter(a=>{const u=dirUser(a.userId);return (u?.name||'').toLowerCase().includes(q)||(u?.nik||'').toLowerCase().includes(q)}).sort((a,b)=>new Date(b.updatedAt||0)-new Date(a.updatedAt||0));const {rows:items,page}=slicePage(rows,'attendance');document.getElementById('attTable').innerHTML=items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Les/Mapel</th><th>Masuk</th><th>Keluar</th><th>Validasi</th><th>Jarak</th><th>Mode</th><th>Aksi</th></tr></thead><tbody>${items.map(a=>{const u=dirUser(a.userId),lesson=db.lessons.find(l=>l.id===a.lessonId);return `<tr><td><strong>${esc(u?.name||'')}</strong><br><small>${esc(u?.nik||'')}</small></td><td>${esc(lesson?.name||'Absensi umum')}</td><td>${a.checkIn?fmtTime(a.checkIn):'—'}</td><td>${a.checkOut?fmtTime(a.checkOut):'—'}</td><td>${a.locationValid===true?'<span class="badge badge-green">Valid</span>':a.locationValid===false?'<span class="badge badge-red">Ditolak</span>':'<span class="badge badge-gray">Manual</span>'}</td><td>${a.distanceMeters!=null?Math.round(a.distanceMeters)+' m':'—'}</td><td>${a.mode==='substitution'?'<span class="badge badge-yellow">Pengganti</span>':'<span class="badge badge-blue">Utama</span>'}</td><td><button class="btn btn-secondary btn-sm" data-edit-att="${a.id}">Edit</button></td></tr>`}).join('')}</tbody></table></div>${pager(rows.length,page,10,'attendance')}`:`<div class="empty">Tidak ada data untuk filter tersebut.</div>`}
function toLocalInput(iso){if(!iso)return '';const d=new Date(iso),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function attendanceEditForm(a){const u=dirUser(a.userId),lesson=db.lessons.find(x=>x.id===a.lessonId);openModal(`<div class="modal-head"><div><strong>Edit Riwayat Absensi</strong><div style="color:#64748b;font-size:12px">Admin dapat memperbaiki waktu dan catatan riwayat.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="editAttForm"><div class="modal-body"><div class="notice">${esc(u?.name||'—')} · ${esc(a.date)} · ${esc(lesson?.name||'Absensi umum')}</div><div style="height:14px"></div><div class="form-grid"><div class="field"><label>Check-in</label><input class="input" type="datetime-local" name="checkIn" value="${toLocalInput(a.checkIn)}"></div><div class="field"><label>Check-out</label><input class="input" type="datetime-local" name="checkOut" value="${toLocalInput(a.checkOut)}"></div><div class="field"><label>Status lokasi</label><select class="select" name="locationValid"><option value="" ${a.locationValid==null?'selected':''}>Manual</option><option value="true" ${a.locationValid===true?'selected':''}>Valid</option><option value="false" ${a.locationValid===false?'selected':''}>Ditolak</option></select></div><div class="field"><label>Jarak (meter)</label><input class="input" type="number" name="distanceMeters" value="${a.distanceMeters??''}"></div><div class="field full"><label>Catatan admin</label><textarea class="textarea" name="adminNote" rows="3">${esc(a.adminNote||'')}</textarea></div></div></div><div class="modal-foot"><button type="button" class="btn btn-white" onclick="closeModal()">Batal</button><button class="btn btn-primary">Simpan perubahan</button></div></form>`);document.getElementById('editAttForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());try{await updateDoc(doc(dbFs,'attendance',a.id),{checkIn:o.checkIn?new Date(o.checkIn).toISOString():null,checkOut:o.checkOut?new Date(o.checkOut).toISOString():null,locationValid:o.locationValid===''?null:o.locationValid==='true',distanceMeters:o.distanceMeters===''?null:Number(o.distanceMeters),adminNote:o.adminNote||'',updatedAt:nowIso(),updatedBy:session.id});closeModal();toast('Riwayat absensi diperbarui.','ok')}catch(err){toast(err.message||'Gagal memperbarui absensi.','err')}}}

function adminGeofence(){return `${pageHead('ADMINISTRATOR','Pengaturan Geofencing','Tentukan titik lokasi dan radius yang diperbolehkan untuk absensi.','<button class="btn btn-secondary" id="detectAdminLocation">⌖ Deteksi Lokasi Otomatis</button>')}<div class="split"><div class="card"><h3 class="section-title">Zona absensi</h3><p class="section-sub">Lokasi akan digunakan untuk memvalidasi absensi mengajar.</p><div class="form-grid"><div class="field full"><label>Nama lokasi</label><input class="input" id="gfCompany" value="${esc(db.settings.company)}"></div><div class="field"><label>Latitude</label><input class="input" id="gfLat" type="number" step="0.000001" value="${db.settings.lat}"></div><div class="field"><label>Longitude</label><input class="input" id="gfLng" type="number" step="0.000001" value="${db.settings.lng}"></div><div class="field"><label>Radius (meter)</label><input class="input" id="gfRadius" type="number" min="1" max="5000" value="${db.settings.radius}"></div><div class="field"><label>Toleransi keterlambatan (menit)</label><input class="input" id="gfGrace" type="number" min="0" max="120" value="${db.settings.graceMinutes}"></div><div class="field full"><label style="display:flex;align-items:center;gap:8px"><input id="gfReq" type="checkbox" ${db.settings.requireLocation?'checked':''}> Wajib validasi lokasi saat absensi</label></div></div><button class="btn btn-primary" id="saveGeo">Simpan pengaturan geofence</button><div style="height:14px"></div><div class="notice warning">Geser pin di peta untuk mengubah titik pusat secara langsung. Perubahan koordinat dan radius belum disimpan sampai tombol "Simpan pengaturan geofence" ditekan.</div></div><div class="card"><div id="geoMap" class="geo-map"><div class="geo-map-loading">Memuat Google Maps...</div></div><div style="height:13px"></div><div class="status-row"><div><strong>Koordinat pusat</strong><div id="geoCoords" style="font-size:12px;color:#64748b;margin-top:3px">${Number(db.settings.lat).toFixed(6)}, ${Number(db.settings.lng).toFixed(6)}</div></div><span class="badge badge-blue" id="geoRadiusBadge">Radius ${db.settings.radius} m</span></div><div style="height:13px"></div><div class="notice">Pin di tengah menjadi patokan pusat geofence. Saat pin digeser, latitude, longitude, dan lingkaran geofence akan langsung mengikuti posisi baru.</div></div></div>`}
async function saveGeofence(){const lat=Number(document.getElementById('gfLat').value),lng=Number(document.getElementById('gfLng').value),radius=Number(document.getElementById('gfRadius').value),grace=Number(document.getElementById('gfGrace').value);if(!Number.isFinite(lat)||!Number.isFinite(lng)||!Number.isFinite(radius)||!Number.isFinite(grace)||lat<-90||lat>90||lng<-180||lng>180||radius<1||radius>5000||grace<0||grace>120)return toast('Isi koordinat dan radius dengan benar.','err');try{await setDoc(doc(dbFs,'settings','main'),{company:document.getElementById('gfCompany').value.trim()||'AbsensiPro Company',lat,lng,radius,graceMinutes:grace,requireLocation:document.getElementById('gfReq').checked,updatedAt:nowIso(),updatedBy:session.id},{merge:true});toast('Pengaturan geofence tersimpan.','ok')}catch(err){toast(err.message||'Gagal menyimpan pengaturan geofence.','err')}}

function adminReports(){const active=activeEmployees(),month=dateKey().slice(0,7),arr=db.attendance.filter(a=>a.date.startsWith(month)),present=arr.filter(a=>a.checkIn).length,pending=db.substitutions.filter(s=>s.status==='pending').length;return `${pageHead('ADMINISTRATOR','Laporan','Ringkasan data absensi dan jadwal.')}<div class="grid grid-4"><div class="card stat"><div><div class="stat-label">Guru aktif</div><div class="stat-value">${active.length}</div></div><div class="stat-icon">♙</div></div><div class="card stat"><div><div class="stat-label">Record bulan ini</div><div class="stat-value">${arr.length}</div></div><div class="stat-icon">▤</div></div><div class="card stat"><div><div class="stat-label">Record check-in</div><div class="stat-value positive">${present}</div></div><div class="stat-icon">✓</div></div><div class="card stat"><div><div class="stat-label">Approval pending</div><div class="stat-value warning">${pending}</div></div><div class="stat-icon">↔</div></div></div><div style="height:16px"></div><div class="card"><h3 class="section-title">Export data</h3><p class="section-sub">Unduh seluruh data absensi dalam format CSV.</p><button class="btn btn-primary" id="exportAll">Download CSV Absensi</button></div>`}
function adminSettings(){return `${pageHead('ADMINISTRATOR','Pengaturan','Pengaturan sistem dan akun Administrator.')}<div class="grid grid-2"><div class="card"><div class="card-head"><div><h3 class="section-title">Ubah Password Administrator</h3><p class="section-sub">Password Administrator dikelola oleh Firebase Authentication.</p></div></div><form id="adminPasswordForm"><div class="field"><label>Password baru *</label><div class="password-wrap"><input class="input" type="password" id="adminNewPassword" minlength="6" autocomplete="new-password" required><button type="button" class="password-icon" data-pw="adminNewPassword" aria-label="Tampilkan password" title="Tampilkan password">◉</button></div></div><div style="height:12px"></div><div class="field"><label>Konfirmasi password baru *</label><div class="password-wrap"><input class="input" type="password" id="adminConfirmPassword" minlength="6" autocomplete="new-password" required><button type="button" class="password-icon" data-pw="adminConfirmPassword" aria-label="Tampilkan password" title="Tampilkan password">◉</button></div></div><div style="height:14px"></div><button class="btn btn-primary" type="submit">Simpan Password</button></form></div><div class="card"><div class="card-head"><div><h3 class="section-title">Reset seluruh sistem</h3><p class="section-sub">Hapus seluruh data karyawan, jadwal, absensi, dan pengajuan pengganti, lalu kembalikan sistem ke kondisi awal.</p></div></div><div class="notice danger"><strong>Peringatan:</strong> tindakan ini tidak dapat dibatalkan. Akun Administrator yang sedang digunakan tetap dipertahankan.</div><div style="height:14px"></div><button class="btn btn-danger" id="resetSystem">Reset Data Sistem</button></div></div>`}

function empDashboard(){const u=me(),today=dateKey(),a=db.attendance.filter(x=>x.userId===u.id&&x.date===today).sort((x,y)=>new Date(y.updatedAt||0)-new Date(x.updatedAt||0))[0],todLessons=getTeacherLessonsForDate(u.id,new Date());return `${pageHead('GURU / KARYAWAN','Selamat datang, '+esc(u?.name||'Guru'),'Pastikan Anda melakukan absensi sebelum mulai mengajar.') }<div class="grid grid-3"><div class="card attendance-card" style="grid-column:span 2"><div class="eyebrow">ABSENSI MENGAJAR HARI INI</div><div class="clock" id="clock">--:--:--</div><div class="date" id="todayLabel">${fmtDate(dateKey())} · ${dayName()}</div><div class="geo-status"><span class="dot ${a?.locationValid===true?'ok':''}"></span><span>${a?.locationValid===true?'Lokasi terakhir tervalidasi':db.settings.requireLocation?'Validasi lokasi diperlukan sebelum absen':'Lokasi tidak diperlukan'}</span></div><div class="big-actions"><button class="btn btn-primary" data-page="attendance">✓ Absen Mengajar</button><button class="btn btn-secondary" data-page="schedule">◫ Lihat Jadwal</button></div><div style="font-size:12px;color:#64748b;margin-top:12px">Radius geofence: ${db.settings.radius} m · ${esc(db.settings.company)}</div></div><div class="card"><div class="profile-card"><div class="avatar-lg">${initials(u.name)}</div><div><strong>${esc(u.name)}</strong><div style="font-size:12px;color:#64748b">${esc(u.position||'Guru')}</div></div></div><div class="kv"><div><small>NIK</small><strong>${esc(u.nik)}</strong></div><div><small>Departemen</small><strong>${esc(u.department||'—')}</strong></div><div><small>Jadwal hari ini</small><strong>${todLessons.length}</strong></div><div><small>Absensi hari ini</small><strong>${db.attendance.filter(x=>x.userId===u.id&&x.date===today).length}</strong></div></div></div></div><div style="height:16px"></div><div class="card"><div class="card-head"><div><h3 class="section-title">Jadwal mengajar hari ini</h3><p class="section-sub">Anda dapat absen pada setiap sesi mapel yang sedang berlangsung.</p></div><button class="btn btn-white btn-sm" data-page="schedule">Buka jadwal</button></div>${renderTeacherToday(todLessons,u.id)}</div>`}
function getTeacherLessonsForDate(uid,date){const d=String(date.getDay());return db.lessons.filter(l=>l.teacherId===uid&&l.active&&l.days.includes(d)).sort((a,b)=>a.start.localeCompare(b.start))}
function getLessonAttendance(uid,lessonId,date=dateKey()){return db.attendance.find(a=>a.userId===uid&&a.lessonId===lessonId&&a.date===date)}
function approvedSubFor(uid,lessonId,date=dateKey()){return db.substitutions.find(s=>s.lessonId===lessonId&&s.substituteTeacherId===uid&&s.date===date&&s.status==='approved')}
function renderTeacherToday(lessons,uid){if(!lessons.length)return '<div class="empty">Tidak ada jadwal mengajar hari ini.</div>';return `<div class="mini-list">${lessons.map(l=>{const a=getLessonAttendance(uid,l.id),now=new Date(),mins=now.getHours()*60+now.getMinutes(),inside=mins>=minutesFromTime(l.start)-db.settings.graceMinutes&&mins<=minutesFromTime(l.end)+db.settings.graceMinutes;return `<div class="mini-item"><div><strong>${esc(l.name)}</strong><div style="font-size:12px;color:#64748b">${esc(l.className||'')} · ${esc(l.start)}–${esc(l.end)}</div></div><div style="text-align:right">${a?.checkIn?'<span class="badge badge-green">Sudah absen</span>':inside?'<span class="badge badge-yellow">Bisa absen</span>':'<span class="badge badge-gray">Di luar jam</span>'}</div></div>`}).join('')}</div>`}

function requestSubstitution(){const u=me(),today=dateKey(),teachers=activeEmployees().filter(x=>x.id!==u.id);if(!teachers.length)return toast('Belum ada guru lain yang aktif.','err');openModal(`<div class="modal-head"><div><strong>Ajukan Pergantian Guru</strong><div style="color:#64748b;font-size:12px">Pilih guru yang tidak hadir, lalu pilih jadwalnya pada hari ${esc(dayName())}.</div></div><button class="close" onclick="closeModal()">×</button></div><form id="subForm"><div class="modal-body"><div class="form-grid"><div class="field full"><label>Guru yang tidak hadir *</label><select class="select" id="subTeacherId" required><option value="">Pilih guru</option>${teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field full"><label>Jadwal guru tersebut hari ini *</label><div id="subScheduleBox" class="muted-box">Pilih nama guru terlebih dahulu.</div></div><div class="field full"><label>Alasan / keterangan</label><textarea class="textarea" name="reason" rows="3" placeholder="Keterangan penggantian"></textarea></div></div></div><div class="modal-foot"><button type="button" class="btn btn-white" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="subSubmit" disabled>Ajukan ke Admin</button></div></form>`);const teacherSel=document.getElementById('subTeacherId'),box=document.getElementById('subScheduleBox'),submit=document.getElementById('subSubmit');teacherSel.onchange=()=>{const teacherId=teacherSel.value;if(!teacherId){box.innerHTML='Pilih nama guru terlebih dahulu.';submit.disabled=true;return}const lessons=getTeacherLessonsForDate(teacherId,new Date());const pendingIds=new Set(db.substitutions.filter(s=>s.date===today&&s.substituteTeacherId===u.id&&s.status==='pending').map(s=>s.lessonId));if(!lessons.length){box.innerHTML='<div class="empty" style="padding:18px 10px">Guru tersebut tidak memiliki jadwal aktif hari ini.</div>';submit.disabled=true;return}box.innerHTML=`<div class="sub-schedule- function requestLocationPermission(){return new Promise(resolve=>{if(!navigator.geolocation){toast('Browser tidak mendukung geolocation.','err');resolve(false);return}const ask=()=>systemConfirm('Izin lokasi diperlukan','Sistem membutuhkan akses lokasi untuk menjalankan geofencing. Tekan Izinkan lokasi untuk melanjutkan.','Izinkan lokasi','Nanti').then(ok=>resolve(ok));if(navigator.permissions&&navigator.permissions.query){navigator.permissions.query({name:'geolocation'}).then(p=>{if(p.state==='granted')resolve(true);else if(p.state==='denied'){toast('Izin lokasi diblokir oleh browser. Aktifkan izin lokasi untuk situs ini.','err');resolve(false)}else ask()}).catch(ask)}else ask()})}
function checkLocationSimple(cb){if(!navigator.geolocation)return toast('Browser tidak mendukung geolocation.','err');requestLocationPermission().then(ok=>{if(!ok)return;navigator.geolocation.getCurrentPosition(p=>cb({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy}),e=>toast('Lokasi gagal diambil: '+(e.message||'izin ditolak'),'err'),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
function getLocation(cb){checkLocationSimple(cb)}
function haversine(lat1,lon1,lat2,lon2){const R=6371000,toRad=x=>x*Math.PI/180,dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1),a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function validateGeofence(pos){const distance=haversine(pos.lat,pos.lng,Number(db.settings.lat),Number(db.settings.lng));return {distance,valid:distance<=Number(db.settings.radius)}}
async function doTeachingAttendance(kind,lessonId){const key=session.id+'|'+lessonId+'|'+kind+'|'+dateKey();if(attendanceBusy.has(key))return toast('Proses absensi masih berjalan.','err');attendanceBusy.add(key);const u=me(),lesson=db.lessons.find(l=>l.id===lessonId);try{if(!lesson||!lesson.active)throw new Error('Jadwal tidak aktif.');const approved=approvedSubFor(u.id,lessonId);if(lesson.teacherId!==u.id&&!approved)throw new Error('Anda bukan guru yang ditugaskan dan belum mendapat approval pengganti.');const now=new Date(),mins=now.getHours()*60+now.getMinutes(),start=minutesFromTime(lesson.start)-db.settings.graceMinutes,end=minutesFromTime(lesson.end)+db.settings.graceMinutes;if(mins<start||mins>end)throw new Error(`Absensi hanya dapat dilakukan sekitar jam ${lesson.start}–${lesson.end}.`);let existing=getLessonAttendance(u.id,lessonId);if(kind==='in'&&existing?.checkIn)throw new Error('Anda sudah check-in pada sesi ini.');if(kind==='out'&&(!existing?.checkIn||existing?.checkOut))throw new Error('Check-out tidak dapat dilakukan pada sesi ini.');const finalize=async(pos)=>{const {distance,valid}=validateGeofence(pos);if(db.settings.requireLocation&&!valid)throw new Error(`Absensi ditolak. Anda berada ${Math.round(distance)} m dari lokasi, maksimum ${db.settings.radius} m.`);existing=getLessonAttendance(u.id,lessonId);if(kind==='in'&&existing?.checkIn)throw new Error('Anda sudah check-in pada sesi ini.');if(kind==='out'&&(!existing?.checkIn||existing?.checkOut))throw new Error('Check-out tidak dapat dilakukan pada sesi ini.');const id=existing?.id||('a_'+Date.now()+'_'+Math.random().toString(36).slice(2,7));const base=existing||{id,userId:u.id,lessonId,date:dateKey(),checkIn:null,checkOut:null,createdAt:nowIso(),mode:approved?'substitution':'primary'};base[kind==='in'?'checkIn':'checkOut']=nowIso();base.updatedAt=nowIso();base.lat=pos.lat;base.lng=pos.lng;base.accuracy=pos.accuracy;base.distanceMeters=distance;base.locationValid=valid;base.mode=approved?'substitution':'primary';await setDoc(doc(dbFs,'attendance',id),base,{merge:true});attendanceBusy.delete(key);toast(kind==='in'?'Check-in sesi berhasil.':'Check-out sesi berhasil.','ok');};if(db.settings.requireLocation)getLocation(pos=>finalize(pos).catch(e=>{attendanceBusy.delete(key);toast(e.message,'err')}));else await finalize({lat:Number(db.settings.lat),lng:Number(db.settings.lng),accuracy:0})}catch(err){attendanceBusy.delete(key);toast(err.message||'Absensi gagal.','err')}}
function exportCsv(rows){if(!rows.length)return toast('Tidak ada data untuk diekspor.','err');const head=['Tanggal','NIK','Nama','Les/Mapel','Kelas','Check-in','Check-out','Mode','Status Lokasi','Jarak Meter','Latitude','Longitude','Catatan Admin'];const lines=[head,...rows.map(a=>{const u=dirUser(a.userId),l=db.lessons.find(x=>x.id===a.lessonId);return[a.date,u?.nik||'',u?.name||'',l?.name||'Absensi umum',l?.className||'',a.checkIn?fmtTime(a.checkIn):'',a.checkOut?fmtTime(a.checkOut):'',a.mode==='substitution'?'Pengganti':'Utama',a.locationValid===true?'Valid':a.locationValid===false?'Ditolak':'Manual',a.distanceMeters??'',a.lat??'',a.lng??'',a.adminNote||'']})].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='laporan-absensi-'+dateKey()+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('CSV berhasil dibuat.','ok')}
function loadGoogleMaps(){if(window.google&&window.google.maps)return Promise.resolve(window.google.maps);if(googleMapsPromise)return googleMapsPromise;if(!GOOGLE_MAPS_API_KEY||GOOGLE_MAPS_API_KEY==='YOUR_GOOGLE_MAPS_API_KEY')return Promise.reject(new Error('Google Maps API Key belum diatur.'));googleMapsPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GOOGLE_MAPS_API_KEY)+'&v=weekly';script.async=true;script.defer=true;script.onload=()=>resolve(window.google.maps);script.onerror=()=>reject(new Error('Google Maps gagal dimuat. Periksa API Key, billing, dan koneksi internet.'));document.head.appendChild(script)});return googleMapsPromise}
function initGeoMap(){const container=document.getElementById('geoMap');if(!container)return;geoMap=null;geoMarker=null;geoCircle=null;loadGoogleMaps().then(()=>{const lat=Number(document.getElementById('gfLat')?.value||db.settings.lat),lng=Number(document.getElementById('gfLng')?.value||db.settings.lng),radius=Number(document.getElementById('gfRadius')?.value||db.settings.radius),center={lat,lng};geoMap=new google.maps.Map(container,{center,zoom:17,mapTypeControl:true,streetViewControl:false,fullscreenControl:true,gestureHandling:'greedy'});geoMarker=new google.maps.Marker({map:geoMap,position:center,draggable:true,title:'Geser untuk mengatur pusat geofence'});geoCircle=new google.maps.Circle({map:geoMap,center,radius,strokeColor:'#2563eb',strokeOpacity:.9,strokeWeight:2,fillColor:'#2563eb',fillOpacity:.18,clickable:false});geoMarker.addListener('drag',()=>{const p=geoMarker.getPosition();document.getElementById('gfLat').value=p.lat().toFixed(6);document.getElementById('gfLng').value=p.lng().toFixed(6);geoCircle.setCenter(p);const coords=document.getElementById('geoCoords');if(coords)coords.textContent=p.lat().toFixed(6)+', '+p.lng().toFixed(6)});geoMarker.addListener('dragend',()=>toast('Titik geofence dipindahkan. Klik "Simpan pengaturan geofence" untuk menyimpan.','ok'));document.getElementById('gfRadius')?.addEventListener('input',()=>{const radius=Number(document.getElementById('gfRadius').value);if(Number.isFinite(radius)&&radius>0){geoCircle.setRadius(radius);const badge=document.getElementById('geoRadiusBadge');if(badge)badge.textContent='Radius '+radius+' m'}})}).catch(err=>{container.innerHTML='<div class="geo-map-loading"><strong>Google Maps belum tersedia</strong><div style="margin-top:7px">'+esc(err.message||'Gagal memuat Google Maps.')+'</div><div style="margin-top:9px;font-size:11px;color:#64748b">Pastikan API Key sudah diisi dan perangkat terhubung ke internet.</div></div>'})}

  if(currentPage==='employees'){renderEmpTable();document.getElementById('empSearch').oninput=renderEmpTable;document.getElementById('addEmployee').onclick=()=>employeeForm();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>employeeForm(db.users.find(u=>u.id===b.dataset.edit)));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const u=db.users.find(u=>u.id===b.dataset.toggle);if(!u)return;try{await updateDoc(doc(dbFs,'users',u.id),{active:!u.active,updatedAt:nowIso()});await updateDoc(doc(dbFs,'directory',u.id),{active:!u.active,updatedAt:nowIso()});toast(u.active?'Karyawan dinonaktifkan.':'Karyawan diaktifkan.','ok')}catch(err){toast(err.message||'Gagal mengubah status.','err')}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(await systemConfirm('Hapus karyawan','Karyawan, akun login lokal, jadwal, absensi, dan pengajuan terkait akan dihapus. Tindakan ini tidak dapat dibatalkan.','Hapus','Batal','danger')){try{await callableDeleteEmployee({uid:b.dataset.delete});toast('Karyawan dan akun Firebase dihapus.','ok')}catch(err){toast(err.message||'Gagal menghapus karyawan.','err')}}})}
  if(currentPage==='lessons'){renderLessonTable();document.getElementById('lessonSearch').oninput=renderLessonTable;document.getElementById('addLesson').onclick=()=>lessonForm();document.querySelectorAll('[data-edit-lesson]').forEach(b=>b.onclick=()=>lessonForm(db.lessons.find(l=>l.id===b.dataset.editLesson)));document.querySelectorAll('[data-toggle-lesson]').forEach(b=>b.onclick=async()=>{const l=db.lessons.find(x=>x.id===b.dataset.toggleLesson);if(!l)return;try{await updateDoc(doc(dbFs,'lessons',l.id),{active:!l.active,updatedAt:nowIso()});toast(l.active?'Jadwal dinonaktifkan.':'Jadwal diaktifkan.','ok')}catch(err){toast(err.message,'err')}});document.querySelectorAll('[data-delete-lesson]').forEach(b=>b.onclick=async()=>{if(await systemConfirm('Hapus les / mapel','Jadwal, pengajuan pengganti, dan absensi yang terkait akan dihapus. Tindakan ini tidak dapat dibatalkan.','Hapus','Batal','danger')){try{const lessonId=b.dataset.deleteLesson;const batch=writeBatch(dbFs);batch.delete(doc(dbFs,'lessons',lessonId));db.substitutions.filter(s=>s.lessonId===lessonId).forEach(s=>batch.delete(doc(dbFs,'substitutions',s.id)));db.attendance.filter(a=>a.lessonId===lessonId).forEach(a=>batch.delete(doc(dbFs,'attendance',a.id)));await batch.commit();toast('Jadwal dihapus.','ok')}catch(err){toast(err.message||'Gagal menghapus jadwal.','err')}}})}
  if(currentPage==='substitutions'){renderSubTable();document.getElementById('subStatusFilter').value=pageState.subStatus||'';document.getElementById('subStatusFilter').onchange=()=>{pageState.subStatus=document.getElementById('subStatusFilter').value;pageState.substitutions=1;renderSubTable();bindPagers()};document.querySelectorAll('[data-approve-sub]').forEach(b=>b.onclick=()=>approveSub(b.dataset.approveSub,true));document.querySelectorAll('[data-reject-sub]').forEach(b=>b.onclick=()=>approveSub(b.dataset.rejectSub,false))}
  if(currentPage==='attendance'){renderAttTable();document.getElementById('attDate').onchange=()=>{pageState.attDate=document.getElementById('attDate').value;pageState.attendance=1;renderAttTable();bindPagers()};document.getElementById('attSearch').oninput=()=>{pageState.attSearch=document.getElementById('attSearch').value;pageState.attendance=1;renderAttTable();bindPagers()};document.getElementById('exportCsv').onclick=()=>exportCsv(db.attendance.filter(a=>a.date===document.getElementById('attDate').value));document.querySelectorAll('[data-edit-att]').forEach(b=>b.onclick=()=>attendanceEditForm(db.attendance.find(a=>a.id===b.dataset.editAtt)))}
  if(currentPage==='geofence'){const detect=()=>getLocation(pos=>{const lat=Number(pos.lat),lng=Number(pos.lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return toast('Koordinat lokasi tidak valid.','err');document.getElementById('gfLat').value=lat.toFixed(6);document.getElementById('gfLng').value=lng.toFixed(6);if(geoMap){const center={lat,lng};geoMap.panTo(center);geoMarker?.setPosition(center);geoCircle?.setCenter(center);const coords=document.getElementById('geoCoords');if(coords)coords.textContent=lat.toFixed(6)+', '+lng.toFixed(6)}toast(`Lokasi terdeteksi. Akurasi ±${Math.round(pos.accuracy)} m.`,'ok')});document.getElementById('detectAdminLocation').onclick=detect;document.getElementById('saveGeo').onclick=saveGeofence;initGeoMap()}
  if(currentPage==='settings'){document.getElementById('resetSystem').onclick=async()=>{if(await systemConfirm('Reset seluruh data sistem','Seluruh data karyawan, jadwal mengajar, absensi, dan pengajuan pengganti akan dihapus. Akun Administrator yang sedang digunakan tetap dipertahankan.','Reset Data','Batal','danger')){try{await callableResetSystem({adminUid:session.id});toast('Seluruh data sistem berhasil direset.','ok')}catch(err){toast(err.message||'Reset gagal dilakukan.','err')}}};document.getElementById('adminPasswordForm').onsubmit=async e=>{e.preventDefault();const newPw=document.getElementById('adminNewPassword').value,confirmPw=document.getElementById('adminConfirmPassword').value;if(newPw.length<6)return toast('Password baru minimal 6 karakter.','err');if(newPw!==confirmPw)return toast('Konfirmasi password tidak sama.','err');try{await callableSetEmployeePassword({uid:session.id,newPassword:newPw,allowAdminSelf:true});toast('Password Administrator berhasil diperbarui.','ok');e.target.reset()}catch(err){toast(err.message||'Gagal memperbarui password.','err')}}}
  if(currentPage==='reports')document.getElementById('exportAll').onclick=()=>exportCsv(db.attendance)
}
function bindEmployee(){if(currentPage==='attendance'){document.getElementById('locCheck').onclick=()=>getLocation(pos=>{const v=validateGeofence(pos);toast(v.valid?`Lokasi valid · ${Math.round(v.distance)} m`:`Di luar area · ${Math.round(v.distance)} m`,v.valid?'ok':'err')});document.getElementById('openSubRequest').onclick=()=>requestSubstitution();document.querySelectorAll('[data-lesson-in]').forEach(b=>b.onclick=()=>doTeachingAttendance('in',b.dataset.lessonIn));document.querySelectorAll('[data-lesson-out]').forEach(b=>b.onclick=()=>doTeachingAttendance('out',b.dataset.lessonOut))}if(currentPage==='history'){renderHist();document.getElementById('histMonth').onchange=()=>{pageState.histMonth=document.getElementById('histMonth').value;pageState.history=1;renderHist();bindPagers()};document.getElementById('histSearch').oninput=()=>{pageState.histSearch=document.getElementById('histSearch').value;pageState.history=1;renderHist();bindPagers()}}}
function bindPage(){if(session.role==='admin')bindAdmin();else bindEmployee();bindPagers()}

// Initial render + Auth observer
render();
restoreAuthObserver();
</script>
